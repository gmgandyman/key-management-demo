---
- name: Create the sites
  ansible.builtin.file:
    path: "{{ item.docroot }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ root_web_directories }}"
  loop_control:
    label: "{{ item.name }}"

- name: Setup the sites-enabled entry for each site
  ansible.builtin.template:
    src: sites-available.python.j2
    dest: "/etc/apache2/sites-available/{{ item.name }}.conf"
    owner: "root"
    group: "root"
    mode: "0644"
  loop: "{{ root_web_directories }}"
  loop_control:
    label: "{{ item.name }}"
  notify: listen for reload apache

- name: Symlink to sites enabled
  ansible.builtin.file:
    state: link
    src: "/etc/apache2/sites-available/{{item.name}}.conf"
    dest: "/etc/apache2/sites-enabled/{{item.name}}.conf"
  loop: "{{ root_web_directories }}"
  loop_control:
    label: "{{ item.name }}"
  notify: listen for reload apache

- name: Deploy simple wsgi app
  ansible.builtin.template:
    src: app.wsgi.j2
    dest: "{{ item.docroot }}/app.wsgi"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0644"
    force: false  # Don't overwrite a app.wsgi file that already exists
  loop: "{{ root_web_directories }}"
  loop_control:
    label: "{{ item.name }}"
