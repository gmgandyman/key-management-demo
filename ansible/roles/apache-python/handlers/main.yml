---
- name: Validate the Apache config
  ansible.builtin.command: apache2ctl -t
  changed_when: false
  listen: listen for reload apache

- name: Check if Apache is running
  ansible.builtin.stat:
    path: /run/apache2/apache2.pid
  register: apache_pidfile
  listen: listen for reload apache

- name: Reload Apache service
  ansible.builtin.command: apache2ctl -k graceful
  when: apache_pidfile.stat.exists  # nginx_pidfile.stat has a lot of data, we only want the exists boolean
  listen: listen for reload apache