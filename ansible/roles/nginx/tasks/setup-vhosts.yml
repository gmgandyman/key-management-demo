---
- name: Template one sites-available file per site
  ansible.builtin.template:
    src: sites-available-template.j2
    dest: "/etc/nginx/sites-available/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  notify: listen for reload nginx

- name: Enable each site (sites-enabled symlink)
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item.name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ item.name }}.conf"
    state: link
  loop: "{{ nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  notify: listen for reload nginx

- name: Disable the stock default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: listen for reload nginx