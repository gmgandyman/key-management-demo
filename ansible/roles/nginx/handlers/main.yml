---
- name: validate nginx config
  ansible.builtin.command: nginx -t
  changed_when: false
  listen: listen for reload nginx

- name: Check if nginx is running
  ansible.builtin.stat:
    path: /run/nginx.pid
  register: nginx_pidfile # hint, keep all the results of the stat for a later task
  listen: listen for reload nginx

- name: Reload nginx service
  ansible.builtin.command: nginx -s reload
  when: nginx_pidfile.stat.exists  # nginx_pidfile.stat has a lot of data, we only want the exists boolean
  listen: listen for reload nginx