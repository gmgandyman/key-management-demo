# Toolbox sits on $TOOLBOX_IP (see .env), by the way -- it's the control node, not an inventory host
database:
  hosts:
    postgres-db:
      ansible_host: "{{ lookup('env', 'POSTGRES_IP') }}"

proxy:
  hosts:
    nginx-proxy-passthru:
      ansible_host: "{{ lookup('env', 'NGINX_IP') }}"

webserver:
  hosts:
    apache2-python:
      ansible_host: "{{ lookup('env', 'APACHE_IP') }}"

bastion:
  hosts:
    ansible-bastion:
      ansible_host: "{{ lookup('env', 'BASTION_IP') }}"