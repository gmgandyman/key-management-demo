[supervisord]
nodaemon=true                      ; stay in the foreground so Docker can track this as PID 1
user=root

[program:sshd]
command=/usr/sbin/sshd -D -e       ; same flags the base image uses as its own entrypoint
autostart=true
autorestart=true
priority=10

[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D /var/lib/postgresql/17/main -c config_file=/etc/postgresql/17/main/postgresql.conf
user=postgres   ; postgres refuses to run as root, so it comes with a user
autostart=true
autorestart=true
priority=20
stopsignal=INT                     ; postgres treats SIGINT as "fast shutdown"
